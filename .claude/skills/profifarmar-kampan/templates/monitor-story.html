<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><link rel="stylesheet" href="brand.css"><title>Týdenní monitor · story</title></head>
<body>
<div class="canvas story photo acc-{{acc}}">
  <img class="bg" src="{{photo_story}}" alt=""><div class="fade high"></div>
  <div class="bottom">
    <span class="chip">{{chip}}</span>
    <div class="eyebrow">{{eyebrow}}</div>
    <h1 class="title" style="font-size:66px">{{title}}</h1>
    <div class="rows">{{#rows}}<div class="row"><span class="n">{{n}}</span><span class="v">{{v}}<small>{{u}}</small></span><span class="d {{dir}}">{{d}}</span></div>{{/rows}}</div>
    <div class="foot-in"><span>{{foot_l}}</span><b>{{foot_r}}</b></div>
  </div>
</div>
</body></html>
